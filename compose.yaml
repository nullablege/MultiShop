services:
  order-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${ORDER_SQL_SA_PASSWORD:?ORDER_SQL_SA_PASSWORD must be set}
    ports:
      - "127.0.0.1:1435:1433"
    volumes:
      - order-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  identity-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${IDENTITY_SQL_SA_PASSWORD:?IDENTITY_SQL_SA_PASSWORD must be set}
    ports:
      - "127.0.0.1:1436:1433"
    volumes:
      - identity-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  cargo-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${CARGO_SQL_SA_PASSWORD:?CARGO_SQL_SA_PASSWORD must be set}
    ports:
      - "127.0.0.1:1437:1433"
    volumes:
      - cargo-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  comment-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${COMMENT_SQL_SA_PASSWORD:?COMMENT_SQL_SA_PASSWORD must be set}
    ports:
      - "127.0.0.1:1438:1433"
    volumes:
      - comment-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q \"SELECT 1\" -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  basket-redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - basket-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  message-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: multishop_message
      POSTGRES_USER: multishop
      POSTGRES_PASSWORD: ${MESSAGE_POSTGRES_PASSWORD:?MESSAGE_POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - message-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multishop -d multishop_message"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  order-sql-data:
  identity-sql-data:
  cargo-sql-data:
  comment-sql-data:
  basket-redis-data:
  message-postgres-data:
